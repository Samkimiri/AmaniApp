<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Take sermon notes, insert scripture inline, and read the Bible offline — no account, nothing leaves your device." />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Amani" />
    <meta name="theme-color" content="#1F3A5F" />
    <meta name="robots" content="index,follow" />
    <!-- Absolute URLs on purpose: crawlers and social scrapers need a full
         URL. Update these if the app moves off amani-app.vercel.app. -->
    <link rel="canonical" href="https://amani-app.vercel.app/" />

    <!-- Social preview card (WhatsApp, iMessage, Slack, X, etc.). The image
         is a purpose-built 1200x630 card generated by
         scripts/generate-social-card.js — the old square app icon got
         cropped awkwardly by most platforms. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amani" />
    <meta property="og:title" content="Amani: Sermon Notes" />
    <meta property="og:description" content="Take sermon notes, insert scripture inline, and read the Bible offline — no account, nothing leaves your device." />
    <meta property="og:image" content="https://amani-app.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Amani: Sermon Notes — take sermon notes, read Scripture offline" />
    <meta property="og:url" content="https://amani-app.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amani: Sermon Notes" />
    <meta name="twitter:description" content="Take sermon notes, insert scripture inline, and read the Bible offline." />
    <meta name="twitter:image" content="https://amani-app.vercel.app/og-image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
